version: "14.0"
description: Repository-specific directives for the Eliware infrastructure template.
directives:
  - id: E-9000.0
    dos:
      - Use committed infrastructure files and deterministic checks as the template baseline.
      - Document managed targets and environments in each derived repository.
      - Define validation, change control, and rollback boundaries.
      - Link each target to its canonical operating procedures.
    donts:
      - Do not add live infrastructure files, plaintext secrets, or copied operating procedures.
